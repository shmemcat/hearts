services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hearts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hearts}
      POSTGRES_DB: ${POSTGRES_DB:-hearts}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      FLASK_APP: hearts:app
      DATABASE_URL: postgresql://${POSTGRES_USER:-hearts}:${POSTGRES_PASSWORD:-hearts}@db:5432/${POSTGRES_DB:-hearts}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      CARDS_PUBLIC_URL: ${CARDS_PUBLIC_URL:-}
      SMTP2GO_API_KEY: ${SMTP2GO_API_KEY:-}
      SMTP2GO_FROM_EMAIL: ${SMTP2GO_FROM_EMAIL:-noreply@shmem.dev}
      ADMIN_KEY: ${ADMIN_KEY:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - VITE_SHARED_ACCOUNTS=${VITE_SHARED_ACCOUNTS:-false}
        - VITE_BASE_PATH=${VITE_BASE_PATH:-/}
      secrets: [fontawesome_token]
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:

secrets:
  fontawesome_token:
    environment: FONTAWESOME_PACKAGE_TOKEN
