name: Check legacy release policy

on:
  pull_request:
    paths: [".github/workflows/release.yml", ".github/workflows/release-policy.yml", "scripts/legacy-release.test.mjs", "package.json"]
  push:
    paths: [".github/workflows/release.yml", ".github/workflows/release-policy.yml", "scripts/legacy-release.test.mjs", "package.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/legacy-release.test.mjs
