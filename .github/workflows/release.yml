name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to publish and deploy
        required: true

concurrency:
  group: hearts-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - name: Validate release
        env:
          FONT_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9_.-]*$ ]]
          if [[ -z "$FONT_TOKEN" ]]; then
            echo "::error::Configure FONTAWESOME_PACKAGE_TOKEN in this repository's Actions secrets."
            exit 1
          fi
      - name: Record checked-out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Test Hearts and the shared API
        env:
          FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
          DATABASE_URL: sqlite://
          CARDS_PUBLIC_URL: ""
          SMTP2GO_API_KEY: ""
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run test:run
          uv run --locked --project api --extra dev pytest api/tests -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the versioned API
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: ghcr.io/shmemcat/hearts-api:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/shmemcat/hearts
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
      - name: Publish the versioned standalone web app
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: |
            VITE_SHARED_ACCOUNTS=false
            VITE_BASE_PATH=/
          secrets: fontawesome_token=${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
          tags: ghcr.io/shmemcat/hearts-web:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/shmemcat/hearts
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
      - name: Publish the versioned Cards-mounted web app
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: |
            VITE_SHARED_ACCOUNTS=true
            VITE_BASE_PATH=/hearts/
          secrets: fontawesome_token=${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
          tags: ghcr.io/shmemcat/hearts-cards-web:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/shmemcat/hearts
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
      - name: Promote successful images for automatic deployment
        run: |
          for name in hearts-api hearts-web hearts-cards-web; do
            docker buildx imagetools create \
              --tag "ghcr.io/shmemcat/$name:latest" \
              "ghcr.io/shmemcat/$name:$RELEASE_TAG"
          done
