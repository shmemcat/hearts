# Private static frontend. The Cards gateway owns all API and socket routes.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location ^~ /api/ { return 404; }
    location ~ (^|/)_internal(/|$) { return 404; }
    location ~ /\. { return 404; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:js|css|svg|png|jpe?g|webp|ico|ttf|woff2?|mp3|ogg|json|txt)$ {
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
