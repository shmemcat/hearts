server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    if ($uri ~ "(^|/)_internal(/|$)") { return 404; }
# Reject nested path escapes before a second proxy can decode them again.
if ($uri ~* "%[0-9a-f]{2}") { return 404; }

    # JSON error returned while the API container is restarting
    location = /api_unavailable.json {
        internal;
        default_type application/json;
        return 503 '{"error":"Server is restarting, please retry in a moment"}';
    }

    # Canonical game URL; the combined Flask backend keeps its current routes.
    location ^~ /api/hearts/ {
        rewrite ^/api/hearts/(.*)$ /$1 break;
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        error_page 502 503 504 /api_unavailable.json;
        add_header Cache-Control "no-store" always;
    }

    # REST compatibility and shared account routes.
    location ^~ /api/ {
        proxy_pass http://api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        error_page 502 503 504 /api_unavailable.json;
    }

    # New and legacy transports, with or without a trailing slash. Rewriting
    # avoids redirects on polling POSTs and preserves the original query.
    location ~ ^/(?:hearts/)?socket\.io/?$ {
        rewrite ^ /socket.io/ break;
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # SPA: serve static files, fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { return 404; }
    location ~* \.(?:js|css|svg|png|jpe?g|webp|ico|ttf|woff2?|mp3|ogg|json|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    # Cache static assets (Vite hashes filenames)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
